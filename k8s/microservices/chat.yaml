apiVersion: v1
kind: Service
metadata:
  name: chat-svc
  namespace: gochat
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/part-of: gochat-platform
spec:
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: health
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: chat
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-deployment
  namespace: gochat
  labels:
    app.kubernetes.io/name: chat
    app.kubernetes.io/part-of: gochat-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat
        app.kubernetes.io/part-of: gochat-platform
    spec:
      containers:
        - name: chat
          image: gochat/chat:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
            - name: health
              containerPort: 9090
          env:
            - name: GRPC_PORT
              value: "50052"
            - name: HEALTH_PORT
              value: "9090"
            - name: AUTH_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: AUTH_GRPC_ADDR
            - name: AUTHZ_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: AUTHZ_GRPC_ADDR
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: REDIS_ADDR
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: CHAT_DB_DSN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-hpa
  namespace: gochat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

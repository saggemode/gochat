apiVersion: v1
kind: Service
metadata:
  name: miniapp-svc
  namespace: gochat
  labels:
    app.kubernetes.io/name: miniapp
    app.kubernetes.io/part-of: gochat-platform
spec:
  ports:
    - name: grpc
      port: 50062
      targetPort: 50062
    - name: health
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: miniapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniapp-deployment
  namespace: gochat
  labels:
    app.kubernetes.io/name: miniapp
    app.kubernetes.io/part-of: gochat-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: miniapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniapp
        app.kubernetes.io/part-of: gochat-platform
    spec:
      containers:
        - name: miniapp
          image: gochat/miniapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50062
            - name: health
              containerPort: 9090
          env:
            - name: GRPC_PORT
              value: "50062"
            - name: HEALTH_PORT
              value: "9090"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: MINIAPP_DB_DSN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15

apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: gochat
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: gochat-platform
spec:
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: health
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: auth
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: gochat
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: gochat-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/part-of: gochat-platform
    spec:
      containers:
        - name: auth
          image: gochat/auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: health
              containerPort: 9090
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: HEALTH_PORT
              value: "9090"
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: REDIS_ADDR
            - name: JWT_EXPIRY_HOURS
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: JWT_EXPIRY_HOURS
            - name: JWT_REFRESH_EXPIRY_DAYS
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: JWT_REFRESH_EXPIRY_DAYS
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: AUTH_DB_DSN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15

apiVersion: v1
kind: Service
metadata:
  name: story-svc
  namespace: gochat
  labels:
    app.kubernetes.io/name: story
    app.kubernetes.io/part-of: gochat-platform
spec:
  ports:
    - name: grpc
      port: 50056
      targetPort: 50056
    - name: health
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: story
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: story-deployment
  namespace: gochat
  labels:
    app.kubernetes.io/name: story
    app.kubernetes.io/part-of: gochat-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: story
  template:
    metadata:
      labels:
        app.kubernetes.io/name: story
        app.kubernetes.io/part-of: gochat-platform
    spec:
      containers:
        - name: story
          image: gochat/story:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50056
            - name: health
              containerPort: 9090
          env:
            - name: GRPC_PORT
              value: "50056"
            - name: HEALTH_PORT
              value: "9090"
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: REDIS_ADDR
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: STORY_DB_DSN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15

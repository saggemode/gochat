apiVersion: v1
kind: Service
metadata:
  name: channel-svc
  namespace: gochat
  labels:
    app.kubernetes.io/name: channel
    app.kubernetes.io/part-of: gochat-platform
spec:
  ports:
    - name: grpc
      port: 50058
      targetPort: 50058
    - name: health
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: channel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-deployment
  namespace: gochat
  labels:
    app.kubernetes.io/name: channel
    app.kubernetes.io/part-of: gochat-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: channel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: channel
        app.kubernetes.io/part-of: gochat-platform
    spec:
      containers:
        - name: channel
          image: gochat/channel:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50058
            - name: health
              containerPort: 9090
          env:
            - name: GRPC_PORT
              value: "50058"
            - name: HEALTH_PORT
              value: "9090"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: CHANNEL_DB_DSN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15

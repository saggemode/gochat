apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  namespace: gochat
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: gochat-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: health
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: gochat
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: gochat-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: gochat-platform
    spec:
      containers:
        - name: gateway
          image: gochat/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 9090
          env:
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: HTTP_PORT
            - name: HEALTH_PORT
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: HEALTH_PORT
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: CORS_ORIGINS
            - name: AUTH_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: AUTH_GRPC_ADDR
            - name: CHAT_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: CHAT_GRPC_ADDR
            - name: MEDIA_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: MEDIA_GRPC_ADDR
            - name: AUTHZ_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: AUTHZ_GRPC_ADDR
            - name: GROUP_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: GROUP_GRPC_ADDR
            - name: STORY_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: STORY_GRPC_ADDR
            - name: CALL_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: CALL_GRPC_ADDR
            - name: CHANNEL_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: CHANNEL_GRPC_ADDR
            - name: SOCIAL_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: SOCIAL_GRPC_ADDR
            - name: MINIAPP_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: MINIAPP_GRPC_ADDR
            - name: BUSINESS_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: BUSINESS_GRPC_ADDR
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gochat-config
                  key: REDIS_ADDR
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gochat-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: gochat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

# Alertmanager: receives firing alerts from Prometheus and emails them.
#
# Before this works, set the 3 placeholders below (smtp_smarthost, smtp_from /
# smtp_auth_username, and the receiver `to:` address) to your real values, and put
# the real SMTP/app password in gochat-secrets under SMTP_PASSWORD (mounted here as
# a file, so it's never in this config). For Gmail use an App Password, host
# smtp.gmail.com:587. For a provider like SendGrid/Mailgun/SES, use their SMTP host
# + credentials.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: gochat
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      # SMTP via Gmail. The App Password is NOT stored here — it's read from the
      # mounted secret file (gochat-secrets → SMTP_PASSWORD), injected at deploy.
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'umeh288@gmail.com'
      smtp_auth_username: 'umeh288@gmail.com'
      smtp_auth_password_file: /etc/alertmanager/secrets/smtp-password
      smtp_require_tls: true
    route:
      receiver: 'email'
      group_by: ['alertname', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        - matchers:
            - severity = "critical"
          receiver: 'email'
          repeat_interval: 1h
    receivers:
      - name: 'email'
        email_configs:
          - to: 'umeh288@gmail.com'
            send_resolved: true
            headers:
              Subject: '[GoChat] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-deployment
  namespace: gochat
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: gochat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: gochat-platform
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - name: web
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: smtp-secret
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: smtp-secret
          secret:
            secretName: gochat-secrets
            items:
              - key: SMTP_PASSWORD
                path: smtp-password
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-svc
  namespace: gochat
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: gochat-platform
spec:
  ports:
    - name: web
      port: 9093
      targetPort: 9093
  selector:
    app.kubernetes.io/name: alertmanager

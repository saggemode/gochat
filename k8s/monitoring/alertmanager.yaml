# Alertmanager: receives firing alerts from Prometheus and routes them to a
# receiver. The receiver below is a placeholder webhook — replace it with a real
# Slack/email/PagerDuty config (and put any webhook URL in gochat-secrets) before
# relying on it in production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: gochat
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: 'default'
      group_by: ['alertname', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        - matchers:
            - severity = "critical"
          receiver: 'default'
          repeat_interval: 1h
    receivers:
      - name: 'default'
        # TODO: replace with a real receiver, e.g.
        # slack_configs:
        #   - api_url: '<SLACK_WEBHOOK_URL>'
        #     channel: '#gochat-alerts'
        webhook_configs:
          - url: 'http://localhost:5001/'
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-deployment
  namespace: gochat
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: gochat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: gochat-platform
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - name: web
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-svc
  namespace: gochat
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: gochat-platform
spec:
  ports:
    - name: web
      port: 9093
      targetPort: 9093
  selector:
    app.kubernetes.io/name: alertmanager

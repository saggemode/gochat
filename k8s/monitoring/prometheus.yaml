# Prometheus: scrapes every GoChat service's /metrics (on the shared health port)
# via Kubernetes service discovery, evaluates alert rules, and forwards firing
# alerts to Alertmanager. Minimal single-replica setup suitable for a small deploy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: gochat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gochat-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gochat-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gochat-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: gochat
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: gochat
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager-svc:9093']
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      # Auto-discover every GoChat service via its "health" port and scrape /metrics.
      - job_name: 'gochat-services'
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: ['gochat']
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: health
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
      # Prometheus itself.
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: gochat
data:
  alerts.yml: |
    groups:
      - name: gochat-availability
        rules:
          - alert: ServiceInstanceDown
            expr: up{job="gochat-services"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.service }} instance is down"
              description: "No metrics scraped from {{ $labels.service }} ({{ $labels.instance }}) for 2m."
          - alert: FrequentRestarts
            expr: changes(process_start_time_seconds{job="gochat-services"}[15m]) > 2
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service }} is restarting frequently"
              description: "{{ $labels.service }} restarted more than twice in 15m."
      - name: gochat-traffic
        rules:
          - alert: HighHTTP5xxRate
            expr: |
              sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
                / sum(rate(http_requests_total[5m])) by (service) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High 5xx error rate on {{ $labels.service }}"
              description: "{{ $labels.service }} is serving >5% 5xx responses over 5m."
          - alert: HighRequestLatencyP99
            expr: |
              histogram_quantile(0.99,
                sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 1.5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High p99 latency on {{ $labels.service }}"
              description: "{{ $labels.service }} p99 request latency is above 1.5s for 10m."
      - name: gochat-resources
        rules:
          - alert: HighMemoryUsage
            expr: process_resident_memory_bytes{job="gochat-services"} > 400 * 1024 * 1024
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service }} high memory usage"
              description: "{{ $labels.service }} resident memory is above 400MB for 10m."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: gochat
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: gochat-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: gochat-platform
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: gochat
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: gochat-platform
spec:
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: prometheus

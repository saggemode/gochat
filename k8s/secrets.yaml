apiVersion: v1
kind: Secret
metadata:
  name: gochat-secrets
  namespace: gochat
  labels:
    app.kubernetes.io/part-of: gochat-platform
type: Opaque
stringData:
  # Database credentials & DSNs
  POSTGRES_USER: "gochat"
  POSTGRES_PASSWORD: "gochat_k8s_secret_change_me"
  POSTGRES_DB: "gochat"
  AUTH_DB_DSN: "postgres://gochat:gochat_k8s_secret_change_me@postgres-svc.gochat.svc.cluster.local:5432/gochat?sslmode=disable"
  AUTHZ_DB_DSN: "postgres://gochat:gochat_k8s_secret_change_me@postgres-svc.gochat.svc.cluster.local:5432/gochat?sslmode=disable"
  CHAT_DB_DSN: "postgres://gochat:gochat_k8s_secret_change_me@postgres-svc.gochat.svc.cluster.local:5432/gochat?sslmode=disable"
  GROUP_DB_DSN: "postgres://gochat:gochat_k8s_secret_change_me@postgres-svc.gochat.svc.cluster.local:5432/gochat?sslmode=disable"
  STORY_DB_DSN: "postgres://gochat:gochat_k8s_secret_change_me@postgres-svc.gochat.svc.cluster.local:5432/gochat?sslmode=disable"
  CALL_DB_DSN: "postgres://gochat:gochat_k8s_secret_change_me@postgres-svc.gochat.svc.cluster.local:5432/gochat?sslmode=disable"
  CHANNEL_DB_DSN: "postgres://gochat:gochat_k8s_secret_change_me@postgres-svc.gochat.svc.cluster.local:5432/gochat?sslmode=disable"
  SOCIAL_DB_DSN: "postgres://gochat:gochat_k8s_secret_change_me@postgres-svc.gochat.svc.cluster.local:5432/gochat?sslmode=disable"
  MINIAPP_DB_DSN: "postgres://gochat:gochat_k8s_secret_change_me@postgres-svc.gochat.svc.cluster.local:5432/gochat?sslmode=disable"
  BUSINESS_DB_DSN: "postgres://gochat:gochat_k8s_secret_change_me@postgres-svc.gochat.svc.cluster.local:5432/gochat?sslmode=disable"

  # Redis & Auth secrets
  REDIS_PASSWORD: "redis_k8s_secret_change_me"
  JWT_SECRET: "jwt_super_secret_signing_key_32bytes_min"

  # Object storage
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin_secret_change_me"

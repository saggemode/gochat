# Prometheus Configuration for GoChat
# Scrape targets for all GoChat microservices

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gochat-gateway'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: /api/v1/metrics

  - job_name: 'gochat-auth'
    static_configs:
      - targets: ['localhost:9091']

  - job_name: 'gochat-chat'
    static_configs:
      - targets: ['localhost:9092']

  - job_name: 'gochat-media'
    static_configs:
      - targets: ['localhost:9093']

  - job_name: 'gochat-story'
    static_configs:
      - targets: ['localhost:9097']

  - job_name: 'gochat-social'
    static_configs:
      - targets: ['localhost:9098']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

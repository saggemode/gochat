[databases]
auth-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
authz-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
chat-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
group-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
story-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
call-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
channel-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
ai-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
payment-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
social-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
miniapp-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres
business-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres

[pgbouncer]
listen_port = 6432
listen_addr = *
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = session
max_client_conn = 1000
default_pool_size = 20
verbose = 1
ignore_startup_parameters = extra_float_digits

[databases]
auth-gochat-db     = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=auth,core,public'
authz-gochat-db    = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=authz,core,public'
chat-gochat-db     = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=chat,core,public'
group-gochat-db    = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=grp,chat,core,public'
story-gochat-db    = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=story,core,public'
call-gochat-db     = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=call,core,public'
channel-gochat-db  = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=channel,core,public'
ai-gochat-db       = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=ai,core,public'
payment-gochat-db  = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=payment,core,public'
social-gochat-db   = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=social,core,public'
miniapp-gochat-db  = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=miniapp,core,public'
business-gochat-db = host=postgres port=5432 dbname=gochat auth_user=postgres options='-c search_path=business,core,public'

[pgbouncer]
listen_port = 6432
listen_addr = *
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres

; ── Pool Mode ─────────────────────────────────────────────────
; transaction: returns server conn to pool after each TX completes
; This is critical for microservices — session mode holds conns idle
pool_mode = transaction

; ── Connection Limits ─────────────────────────────────────────
max_client_conn = 1000
default_pool_size = 10
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3

; ── Transaction-Mode Safety ───────────────────────────────────
; IMPORTANT: Do NOT use DISCARD ALL — it resets search_path to
; the system default, breaking our per-service schema isolation.
; DEALLOCATE ALL cleans up prepared statements (the main concern
; with pgx driver) without touching search_path.
server_reset_query = DEALLOCATE ALL
server_reset_query_always = 1

; ── Timeouts ──────────────────────────────────────────────────
server_idle_timeout = 600
server_lifetime = 3600
client_idle_timeout = 0
query_timeout = 30
query_wait_timeout = 120

; ── Misc ──────────────────────────────────────────────────────
verbose = 0
ignore_startup_parameters = extra_float_digits


# ============================================================================
# GoChat — Nginx Reverse Proxy & Load Balancer
# Production-grade config with rate limiting, body size controls,
# security headers, and WebSocket support.
# ============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── Core Settings ────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;   # Hide nginx version from responses

    # ── Client Body Size Limits ──────────────────────────────────
    # Default: 1MB for API requests
    client_max_body_size       1m;
    client_body_buffer_size    128k;
    client_header_buffer_size  4k;
    large_client_header_buffers 4 16k;
    client_body_timeout        30s;
    client_header_timeout      30s;

    # ── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Gzip Compression ─────────────────────────────────────────
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  4;
    gzip_min_length  256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/xml;

    # ── WebSocket Upgrade Map ────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Rate Limiting Zones ──────────────────────────────────────
    # General API: 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

    # Auth endpoints (login/register): 5 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

    # Media uploads: 3 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_upload:10m rate=3r/s;

    # WebSocket connections: 5 new connections/second per IP
    limit_req_zone $binary_remote_addr zone=ws_connect:10m rate=5r/s;

    # Connection limiting: max 50 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Rate limit response code (429 Too Many Requests)
    limit_req_status  429;
    limit_conn_status 429;

    # ── Upstream ─────────────────────────────────────────────────
    upstream gateway_servers {
        server gateway:8080;
        keepalive 32;
    }

    # ── Server Block ─────────────────────────────────────────────
    server {
        listen 8080;
        server_name _;

        # Global connection limit per IP
        limit_conn conn_per_ip 50;

        # ── Security Headers ─────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

        # ── Health Check ─────────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Auth Endpoints (strict rate limit) ───────────────────
        location ~ ^/api/v1/(auth|login|register|verify) {
            limit_req zone=api_auth burst=10 nodelay;

            client_max_body_size 64k;   # Auth payloads are small

            proxy_pass http://gateway_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── Media Upload Endpoints (large body, strict rate) ─────
        location ~ ^/api/v1/(media|upload) {
            limit_req zone=api_upload burst=5 nodelay;

            client_max_body_size       100m;   # Allow large file uploads
            client_body_buffer_size    1m;
            proxy_request_buffering    off;    # Stream uploads directly

            proxy_pass http://gateway_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;  # Large uploads need time
            proxy_send_timeout    300s;
        }

        # ── WebSocket Endpoint ───────────────────────────────────
        location /ws {
            limit_req zone=ws_connect burst=3 nodelay;

            proxy_pass http://gateway_servers;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Long timeouts for persistent connections
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;

            # Disable buffering for real-time
            proxy_buffering off;
        }

        # ── General API (default) ────────────────────────────────
        location / {
            limit_req zone=api_general burst=50 nodelay;

            proxy_pass http://gateway_servers;
            proxy_http_version 1.1;

            # Standard headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            # Buffering
            proxy_buffering        on;
            proxy_buffer_size      8k;
            proxy_buffers          8 16k;
            proxy_busy_buffers_size 32k;
        }

        # ── Block common attack paths ────────────────────────────
        location ~ /\.(env|git|htaccess|htpasswd|ini|log|bak|sql) {
            deny all;
            return 444;
        }
    }
}

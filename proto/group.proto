syntax = "proto3";

package group;

option go_package = "gochat/gen/group";

service GroupService {
  rpc UpdateGroupMetadata(UpdateGroupMetadataRequest) returns (UpdateGroupMetadataResponse);
  rpc GetGroupMetadata(GetGroupMetadataRequest) returns (GetGroupMetadataResponse);
  rpc GenerateInviteLink(GenerateInviteLinkRequest) returns (GenerateInviteLinkResponse);
  rpc JoinByInviteCode(JoinByInviteCodeRequest) returns (JoinByInviteCodeResponse);
  rpc GetPendingApprovals(GetPendingApprovalsRequest) returns (GetPendingApprovalsResponse);
  rpc ResolvePendingApproval(ResolvePendingApprovalRequest) returns (ResolvePendingApprovalResponse);
  rpc PromoteMember(PromoteMemberRequest) returns (PromoteMemberResponse);
  rpc DemoteMember(DemoteMemberRequest) returns (DemoteMemberResponse);
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse);

  // Communities
  rpc CreateCommunity(CreateCommunityRequest) returns (CreateCommunityResponse);
  rpc AddGroupToCommunity(AddGroupToCommunityRequest) returns (AddGroupToCommunityResponse);
  rpc RemoveGroupFromCommunity(RemoveGroupFromCommunityRequest) returns (RemoveGroupFromCommunityResponse);
  rpc GetCommunity(GetCommunityRequest) returns (GetCommunityResponse);
  rpc ListCommunities(ListCommunitiesRequest) returns (ListCommunitiesResponse);

  // Broadcast Lists
  rpc CreateBroadcastList(CreateBroadcastListRequest) returns (CreateBroadcastListResponse);
  rpc DeleteBroadcastList(DeleteBroadcastListRequest) returns (DeleteBroadcastListResponse);
  rpc AddBroadcastRecipient(AddBroadcastRecipientRequest) returns (AddBroadcastRecipientResponse);
  rpc RemoveBroadcastRecipient(RemoveBroadcastRecipientRequest) returns (RemoveBroadcastRecipientResponse);
  rpc GetBroadcastList(GetBroadcastListRequest) returns (GetBroadcastListResponse);

  // Bot Management
  rpc UpdateBotConfig(UpdateBotConfigRequest) returns (UpdateBotConfigResponse);
  rpc GetBotConfig(GetBotConfigRequest) returns (GetBotConfigResponse);
  rpc AddBotToGroup(AddBotToGroupRequest) returns (AddBotToGroupResponse);
  rpc GetAuditLogs(GetAuditLogsRequest) returns (GetAuditLogsResponse);
  rpc LogAuditAction(LogAuditActionRequest) returns (LogAuditActionResponse);
}

message GroupMetadata {
  string conversation_id = 1;
  string description = 2;
  bool announcements_only = 3;
  bool admins_only_edit_info = 4;
  string invite_code = 5;
  bool join_approval_required = 6;
  string name = 7;
  string avatar_url = 8;
}

message UpdateGroupMetadataRequest {
  string conversation_id = 1;
  string requester_id = 2;
  string description = 3;
  bool announcements_only = 4;
  bool admins_only_edit_info = 5;
  bool join_approval_required = 6;
  string name = 7;
  string avatar_url = 8;
}

message UpdateGroupMetadataResponse {
  GroupMetadata metadata = 1;
}

message GetGroupMetadataRequest {
  string conversation_id = 1;
  string requester_id = 2;
}

message GetGroupMetadataResponse {
  GroupMetadata metadata = 1;
}

message GenerateInviteLinkRequest {
  string conversation_id = 1;
  string requester_id = 2;
}

message GenerateInviteLinkResponse {
  string invite_code = 1;
}

message JoinByInviteCodeRequest {
  string invite_code = 1;
  string user_id = 2;
}

message JoinByInviteCodeResponse {
  string conversation_id = 1;
  string status = 2; // "joined" or "pending_approval"
}

message GroupJoinApproval {
  string id = 1;
  string conversation_id = 2;
  string user_id = 3;
  string status = 4;
  int64 requested_at = 5;
  string resolved_by = 6;
  int64 resolved_at = 7;
  string user_display_name = 8;
  string user_avatar_url = 9;
}

message GetPendingApprovalsRequest {
  string conversation_id = 1;
  string requester_id = 2;
}

message GetPendingApprovalsResponse {
  repeated GroupJoinApproval approvals = 1;
}

message ResolvePendingApprovalRequest {
  string approval_id = 1;
  string resolver_id = 2;
  bool approve = 3;
}

message ResolvePendingApprovalResponse {
  bool success = 1;
  string conversation_id = 2;
  string user_id = 3;
}

message PromoteMemberRequest {
  string conversation_id = 1;
  string requester_id = 2;
  string target_user_id = 3;
  string role = 4; // e.g. "admin", "moderator"
}

message PromoteMemberResponse {
  bool success = 1;
}

message DemoteMemberRequest {
  string conversation_id = 1;
  string requester_id = 2;
  string target_user_id = 3;
}

message DemoteMemberResponse {
  bool success = 1;
}

message GroupMemberItem {
  string user_id = 1;
  string role = 2; // "owner", "admin", "member"
  int64 joined_at = 3;
}

message ListGroupMembersRequest {
  string conversation_id = 1;
  string requester_id = 2;
}

message ListGroupMembersResponse {
  repeated GroupMemberItem members = 1;
}

message Community {
  string id                      = 1;
  string name                    = 2;
  string description             = 3;
  string created_by              = 4;
  int64  created_at              = 5;
  repeated string group_conversation_ids = 6;
}

message CreateCommunityRequest {
  string name        = 1;
  string description = 2;
  string creator_id  = 3;
}

message CreateCommunityResponse {
  Community community = 1;
}

message AddGroupToCommunityRequest {
  string community_id    = 1;
  string conversation_id = 2;
  string requester_id    = 3;
}

message AddGroupToCommunityResponse {
  bool success = 1;
}

message RemoveGroupFromCommunityRequest {
  string community_id    = 1;
  string conversation_id = 2;
  string requester_id    = 3;
}

message RemoveGroupFromCommunityResponse {
  bool success = 1;
}

message GetCommunityRequest {
  string community_id = 1;
}

message GetCommunityResponse {
  Community community = 1;
}

message ListCommunitiesRequest {
  string user_id = 1; // optional
}

message ListCommunitiesResponse {
  repeated Community communities = 1;
}

message BroadcastList {
  string id                    = 1;
  string owner_id              = 2;
  string name                  = 3;
  int64  created_at            = 4;
  repeated string recipient_ids = 5;
}

message CreateBroadcastListRequest {
  string owner_id              = 1;
  string name                  = 2;
  repeated string recipient_ids = 3;
}

message CreateBroadcastListResponse {
  BroadcastList broadcast_list = 1;
}

message DeleteBroadcastListRequest {
  string id       = 1;
  string owner_id = 2;
}

message DeleteBroadcastListResponse {
  bool success = 1;
}

message AddBroadcastRecipientRequest {
  string broadcast_list_id = 1;
  string recipient_id      = 2;
  string owner_id          = 3;
}

message AddBroadcastRecipientResponse {
  bool success = 1;
}

message RemoveBroadcastRecipientRequest {
  string broadcast_list_id = 1;
  string recipient_id      = 2;
  string owner_id          = 3;
}

message RemoveBroadcastRecipientResponse {
  bool success = 1;
}

message GetBroadcastListRequest {
  string broadcast_list_id = 1;
  string owner_id          = 2;
}

message GetBroadcastListResponse {
  BroadcastList broadcast_list = 1;
}

enum BotPermission {
  MANAGE_MESSAGES = 0;
  WARN_MEMBERS = 1;
  MUTE_MEMBERS = 2;
  REMOVE_MEMBERS = 3;
  BAN_MEMBERS = 4;
  APPROVE_MEMBERS = 5;
  MANAGE_INVITES = 6;
  MANAGE_GROUP_INFO = 7;
  PIN_MESSAGES = 8;
  SEND_ANNOUNCEMENTS = 9;
  MANAGE_RULES = 10;
  MANAGE_ROLES = 11;
  MANAGE_LINKS = 12;
  ANTI_SPAM = 13;
  ANTI_FLOOD = 14;
  ANTI_SCAM = 15;
  KEYWORD_FILTER = 16;
  WELCOME_MEMBERS = 17;
  GOODBYE_MESSAGES = 18;
  AUTO_REPLY = 19;
  POLL_MANAGEMENT = 20;
  EVENT_MANAGEMENT = 21;
  MEMBER_STATISTICS = 22;
  AUDIT_LOGS = 23;
}

message BotConfig {
  string bot_id = 1;
  string group_id = 2;
  repeated BotPermission permissions = 3;
  bool is_active = 4;
  string commands_prefix = 5;
  string rules = 6;
  string welcome_message = 7;
  int32 spam_protection_level = 8;
}

message UpdateBotConfigRequest {
  string requester_id = 1;
  BotConfig config = 2;
}

message UpdateBotConfigResponse {
  bool success = 1;
}

message GetBotConfigRequest {
  string group_id = 1;
  string requester_id = 2;
}

message GetBotConfigResponse {
  BotConfig config = 1;
}

message AddBotToGroupRequest {
  string conversation_id = 1;
  string requester_id = 2;
  string bot_user_id = 3;
}

message AddBotToGroupResponse {
  bool success = 1;
}

message AuditLogEntry {
  string id = 1;
  string conversation_id = 2;
  string actor_id = 3;
  string action_type = 4;
  string target_id = 5;
  string reason = 6;
  int64 created_at = 7;
}

message GetAuditLogsRequest {
  string conversation_id = 1;
  string requester_id = 2;
  int32 limit = 3;
}

message GetAuditLogsResponse {
  repeated AuditLogEntry logs = 1;
}

message LogAuditActionRequest {
  string conversation_id = 1;
  string actor_id = 2;
  string action_type = 3;
  string target_id = 4;
  string reason = 5;
}

message LogAuditActionResponse {
  bool success = 1;
}

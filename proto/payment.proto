syntax = "proto3";

package payment;

option go_package = "gochat/gen/payment";

// ── Payment Service ──────────────────────────────────────────────────────────

service PaymentService {
  // Wallet management
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);

  // P2P transfers
  rpc SendPayment(SendPaymentRequest) returns (SendPaymentResponse);
  rpc RequestPayment(RequestPaymentRequest) returns (RequestPaymentResponse);

  // Expense splitting
  rpc CreateExpenseGroup(CreateExpenseGroupRequest) returns (CreateExpenseGroupResponse);
  rpc AddExpense(AddExpenseRequest) returns (AddExpenseResponse);
  rpc SettleExpense(SettleExpenseRequest) returns (SettleExpenseResponse);
  rpc GetExpenseGroup(GetExpenseGroupRequest) returns (GetExpenseGroupResponse);

  // Transaction history
  rpc GetTransactionHistory(GetTransactionHistoryRequest) returns (GetTransactionHistoryResponse);
}

// ── Messages ─────────────────────────────────────────────────────────────────

message Wallet {
  string id        = 1;
  string user_id   = 2;
  double balance   = 3;
  string currency  = 4;
  bool   is_active = 5;
}

message Transaction {
  string id              = 1;
  string from_wallet_id  = 2;
  string to_wallet_id    = 3;
  double amount          = 4;
  string currency        = 5;
  string type            = 6;
  string status          = 7;
  string description     = 8;
  int64  created_at      = 9;
}

message ExpenseGroup {
  string id              = 1;
  string conversation_id = 2;
  string name            = 3;
  string created_by      = 4;
  bool   is_settled      = 5;
  double total_amount    = 6;
  string currency        = 7;
  repeated ExpenseItem items = 8;
}

message ExpenseItem {
  string id          = 1;
  string paid_by     = 2;
  string description = 3;
  double amount      = 4;
  repeated ExpenseShare shares = 5;
}

message ExpenseShare {
  string user_id      = 1;
  double share_amount = 2;
  bool   is_settled   = 3;
}

// ── Request/Response ─────────────────────────────────────────────────────────

message CreateWalletRequest {
  string user_id  = 1;
  string currency = 2;
}
message CreateWalletResponse { Wallet wallet = 1; }

message GetWalletRequest { string user_id = 1; }
message GetWalletResponse { Wallet wallet = 1; }

message SendPaymentRequest {
  string sender_id   = 1;
  string receiver_id = 2;
  double amount      = 3;
  string currency    = 4;
  string description = 5;
}
message SendPaymentResponse { Transaction transaction = 1; }

message RequestPaymentRequest {
  string requester_id = 1;
  string payer_id     = 2;
  double amount       = 3;
  string currency     = 4;
  string description  = 5;
}
message RequestPaymentResponse { Transaction transaction = 1; }

message CreateExpenseGroupRequest {
  string conversation_id = 1;
  string created_by      = 2;
  string name            = 3;
  string currency        = 4;
}
message CreateExpenseGroupResponse { ExpenseGroup group = 1; }

message AddExpenseRequest {
  string expense_group_id = 1;
  string paid_by          = 2;
  string description      = 3;
  double amount           = 4;
  repeated string split_among = 5; // user IDs to split among
}
message AddExpenseResponse { ExpenseItem item = 1; }

message SettleExpenseRequest {
  string expense_group_id = 1;
  string user_id          = 2;
}
message SettleExpenseResponse { bool success = 1; }

message GetExpenseGroupRequest { string expense_group_id = 1; }
message GetExpenseGroupResponse { ExpenseGroup group = 1; }

message GetTransactionHistoryRequest {
  string user_id = 1;
  int32  limit   = 2;
  int32  offset  = 3;
}
message GetTransactionHistoryResponse {
  repeated Transaction transactions = 1;
  int32 total = 2;
}

name: GoChat CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate Kustomize Build
        run: |
          kustomize build k8s/ > /dev/null
          echo "Kubernetes manifests and Kustomize build are valid!"

  backend-check:
    name: Backend Go Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Go Build
        run: go build ./...

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test ./...

  android-build:
    name: Android App Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ./GoChat_Kotlin
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: GoChat_Kotlin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  flutter-check:
    name: Flutter Client Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./flutter
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: ./flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
